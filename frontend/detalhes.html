<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlugAqui - Detalhes do anúncio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="style/paginas.css" rel="stylesheet">
  <link href="style/navbar.css" rel="stylesheet">
  <link href="style/componentes.css" rel="stylesheet">
</head>
<body class="pagina-formulario pagina-detalhe">

  <header class="topo">
    <div id="logo">
      <h1 class="marca"><i class="bi bi-houses fs-1"></i>Alug<span>Aqui</span></h1>
      <h2>Detalhes do imóvel</h2>
    </div>
    <div id="navbar"></div>
  </header>

  <main class="container py-4">
    <article class="form-painel" id="ficha-anuncio">
      <p id="msg-detalhes" class="msg-form erro mb-3" role="alert" hidden></p>

      <div id="conteudo-detalhes" hidden>
        <a class="link-voltar" href="index.html">
          <i class="bi bi-arrow-left" aria-hidden="true"></i> Voltar
        </a>

        <div class="row g-4 align-items-stretch">
          <div class="col-lg-6" id="carrossel-anuncio"></div>

          <div class="col-lg-6 coluna-ficha">
            <span id="badge-tipo" class="badge-tipo"></span>
            <h2 id="titulo-anuncio" class="form-titulo"></h2>
            <p id="endereco-anuncio" class="endereco-anuncio">
              <i class="bi bi-geo-alt" aria-hidden="true"></i>
              <span id="texto-endereco"></span>
            </p>
            <p id="preco-anuncio" class="preco-detalhe"></p>

            <ul id="atributos-imovel" class="atributos-imovel"></ul>

            <div class="contato-anunciante">
              <p id="nome-anunciante" class="nome-anunciante" hidden></p>
              <a id="btn-contato" class="btn btn-success w-100" hidden target="_blank" rel="noopener noreferrer">
                <i class="bi bi-whatsapp" aria-hidden="true"></i> Falar no WhatsApp
              </a>
              <p id="aviso-login-contato" class="text-muted small mb-0" hidden>
                Para falar com o anunciante, <a href="login.html">entre na sua conta</a>.
              </p>
            </div>
          </div>

          <div class="col-12">
            <section id="sobre-imovel" class="sobre-imovel" hidden>
              <h3>Sobre o imóvel</h3>
              <p id="descricao-anuncio"></p>
            </section>
          </div>

          <div class="col-12">
            <section class="secao-comentarios" aria-labelledby="titulo-comentarios">
              <h3 id="titulo-comentarios">Comentários</h3>
              <p id="msg-comentarios" class="msg-form" hidden></p>
              <form id="form-comentario" class="mb-3" hidden>
                <label class="form-label visually-hidden" for="texto-comentario">Escreva um comentário</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="texto-comentario" maxlength="255" placeholder="Escreva um comentário...">
                  <button type="submit" class="btn btn-primary">Comentar</button>
                </div>
              </form>
              <p id="aviso-login-comentario" class="text-muted small mb-3" hidden>
                Para comentar, <a href="login.html">entre na sua conta</a>.
              </p>
              <div id="lista-comentarios"></div>
            </section>
          </div>
        </div>
      </div>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/detalhes.js"></script>
  <script type="module" src="js/components/Navbar.js"></script>
</body>
</html>
